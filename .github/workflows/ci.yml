name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint, boot check and tests (PHP 8.3)
    runs-on: ubuntu-latest
    env:
      # Keep everything self-contained: no MySQL, Meilisearch, Redis or mail server.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SCOUT_DRIVER: "null"
      SCOUT_QUEUE: "false"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TELESCOPE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, sqlite3, pdo_sqlite, zip, exif, pcntl, bcmath
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # composer.json's post-autoload-dump runs "artisan package:discover" and
      # "artisan filament:upgrade", which need a bootable app. Install with
      # --no-scripts first, then run those commands manually once .env exists.
      - name: Install composer dependencies (no scripts)
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: PHP syntax lint
        run: |
          set -o pipefail
          find app database routes config -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run package discovery (mirrors post-autoload-dump scripts)
        run: |
          php artisan package:discover --ansi
          php artisan filament:upgrade

      - name: Boot check
        run: php artisan about

      - name: Run tests
        run: php artisan test
