name: sobhe_sahel_member
description: "اپلیکیشن باشگاه اعضای صبح ساحل — Sobhe Sahel membership app (bilingual fa/en, RTL, glassmorphism)."
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27+ (Dart 3.6+) is required for the Color.withValues API and the
  # CardThemeData / DialogThemeData theme types used by the theme layer. The
  # Dart lower bound is kept at 3.4 as requested; the Flutter pin raises the
  # effective floor to Dart 3.6, which still satisfies it.
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # Kept in a range so it resolves against whichever intl flutter_localizations
  # pins (0.19.0 on Flutter 3.27, 0.20.x on 3.29+).
  intl: ">=0.19.0 <0.21.0"
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
